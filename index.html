<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Angela</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  min-height:100vh;
  background:#ede9e3;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
}
canvas {
  display:block;
  border-radius:4px;
  box-shadow:0 16px 60px rgba(0,0,0,0.20), 0 4px 14px rgba(0,0,0,0.10);
}
#msg {
  margin-top:30px;
  padding-bottom:max(64px, env(safe-area-inset-bottom, 64px));
  font-size:27px;
  font-style:italic;
  color:#8b1728;
  letter-spacing:2px;
  opacity:0;
  transition:opacity 3.5s ease;
}
#msg.show { opacity:1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">for Angela, with love</div>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// 2:3 — matches rose.jpeg natural ratio
const W = 340, H = 510;
canvas.width  = W;
canvas.height = H;

const TOTAL = 7800;               // ms — unhurried, organic pacing
const t0    = performance.now();

// ── Easing functions ─────────────────────────────────────────────────
function easeOut3(t)    { return 1 - (1-t)**3; }
function easeInOut4(t)  { return t < .5 ? 8*t**4 : 1-(-2*t+2)**4/2; }
function easeOutBack(t) { return 1 + 2.70158*(t-1)**3 + 1.70158*(t-1)**2; }
function easeOutSine(t) { return Math.sin(t * Math.PI / 2); }

function ph(t, s, e, fn) {
  fn = fn || easeInOut4;
  const v = (t - s) / (e - s);
  return fn(Math.max(0, Math.min(1, v)));
}

// ── Bezier stem path (traced from photo) ────────────────────────────
// Stem base ≈ (52%, 97.5%), control points create gentle rightward lean at
// bottom straightening to near-vertical by top.
const BEZ = [
  W*.505, H*.975,   // P0  base
  W*.518, H*.720,   // P1  ctrl
  W*.500, H*.480,   // P2  ctrl
  W*.490, H*.355,   // P3  sepal
];

function bPt(u) {
  const [x0,y0,x1,y1,x2,y2,x3,y3] = BEZ, m = 1-u;
  return [ m**3*x0 + 3*m**2*u*x1 + 3*m*u**2*x2 + u**3*x3,
           m**3*y0 + 3*m**2*u*y1 + 3*m*u**2*y2 + u**3*y3 ];
}
function bTan(u) {
  const [x0,y0,x1,y1,x2,y2,x3,y3] = BEZ, m = 1-u;
  return [ 3*m**2*(x1-x0) + 6*m*u*(x2-x1) + 3*u**2*(x3-x2),
           3*m**2*(y1-y0) + 6*m*u*(y2-y1) + 3*u**2*(y3-y2) ];
}

// ── Photo ────────────────────────────────────────────────────────────
const img = new Image();
img.src = 'rose.jpeg';

// Draw photo clipped to a filled path
function clipDraw(pathFn, alpha) {
  ctx.save();
  if (alpha != null) ctx.globalAlpha = alpha;
  ctx.beginPath();
  pathFn();
  ctx.clip();
  ctx.drawImage(img, 0, 0, W, H);
  ctx.restore();
}

// ── Stem: fat bezier tube ────────────────────────────────────────────
// Compute offset polygons on both sides of the bezier, form a tube shape.
function stemTube(progress) {
  const N = 60, hw = 12;
  const L = [], R = [];
  for (let i = 0; i <= N; i++) {
    const u = (i / N) * progress;
    const [px, py] = bPt(u);
    const [tx, ty] = bTan(u);
    const d = Math.hypot(tx, ty) || 1;
    const nx = -ty/d, ny = tx/d;
    L.push([px + nx*hw, py + ny*hw]);
    R.push([px - nx*hw, py - ny*hw]);
  }
  ctx.moveTo(L[0][0], L[0][1]);
  L.forEach(([x,y]) => ctx.lineTo(x, y));
  for (let i = R.length-1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
  ctx.closePath();
}

// ── Leaf ellipses (measured from photo) ─────────────────────────────
// Each leaf is a rotated ellipse centered on the leaf's midpoint.
// easeOutBack gives a natural springy unfurl — slightly overshoots then settles.
const LEAVES = [
  // ── Lower cluster (attachment ~y=66%) ──
  // Large lower-left leaf — goes far left and gently downward
  { cx: W*.310, cy: H*.695, rx: W*.175, ry: H*.078, rot: -12*Math.PI/180, t0:.25, t1:.53 },
  // Lower-right leaf — points right-upward
  { cx: W*.678, cy: H*.615, rx: W*.148, ry: H*.063, rot:  20*Math.PI/180, t0:.29, t1:.56 },
  // Small upward leaflet at lower junction
  { cx: W*.490, cy: H*.576, rx: W*.057, ry: H*.040, rot: -68*Math.PI/180, t0:.33, t1:.59 },

  // ── Upper cluster (attachment ~y=46%) ──
  // Upper-left leaf
  { cx: W*.298, cy: H*.448, rx: W*.168, ry: H*.062, rot:  -8*Math.PI/180, t0:.42, t1:.67 },
  // Upper-right leaf
  { cx: W*.703, cy: H*.447, rx: W*.147, ry: H*.057, rot:   6*Math.PI/180, t0:.45, t1:.70 },
  // Small leaflet at upper junction
  { cx: W*.490, cy: H*.415, rx: W*.050, ry: H*.034, rot: -72*Math.PI/180, t0:.50, t1:.73 },
];

// ── Bloom: staggered per-petal circles ───────────────────────────────
// One circle per visible petal + sepal neck + central bud.
// Ordered back-to-front in the reveal.
const BX = W*.495, BY = H*.193, BR = H*.178;

const PETALS = [
  // Sepal neck — tiny bridge between stem top and bloom base
  { cx: BX,          cy: BY + BR*.50, r: BR*.30, t0:.57, t1:.72 },
  // Central bud
  { cx: BX,          cy: BY,          r: BR*.42, t0:.61, t1:.79 },
  // Top petal — positioned above centre
  { cx: BX - W*.008, cy: BY - BR*.55, r: BR*.80, t0:.70, t1:.90 },
  // Top-left petal
  { cx: BX - W*.068, cy: BY - BR*.28, r: BR*.77, t0:.73, t1:.92 },
  // Bottom-left petal
  { cx: BX - W*.062, cy: BY + BR*.32, r: BR*.76, t0:.75, t1:.94 },
  // Bottom-right petal
  { cx: BX + W*.062, cy: BY + BR*.32, r: BR*.76, t0:.77, t1:.95 },
  // Top-right petal
  { cx: BX + W*.068, cy: BY - BR*.28, r: BR*.77, t0:.71, t1:.91 },
];

// ── Floating petal particles ─────────────────────────────────────────
const ptcls = [];

function spawnPetal() {
  ptcls.push({
    x:  BX + (Math.random()-.5)*55,
    y:  BY + (Math.random()-.5)*40,
    vx: (Math.random()-.5)*.45,
    vy: -.25 - Math.random()*.55,
    rot:  Math.random() * Math.PI,
    drot: (Math.random()-.5) * .055,
    w: 2.5 + Math.random()*4,
    h: 1.2 + Math.random()*2,
    hue: 338 + Math.random()*22,
    life: 1,
    decay: .004 + Math.random()*.007,
  });
}

function drawParticles() {
  for (let i = ptcls.length-1; i >= 0; i--) {
    const p = ptcls[i];
    p.x  += p.vx;  p.y += p.vy;
    p.vy += .016;                          // soft gravity
    p.vx += (Math.random()-.5) * .025;    // gentle drift
    p.rot += p.drot;
    p.life -= p.decay;
    if (p.life <= 0) { ptcls.splice(i,1); continue; }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.life**2 * .70;
    ctx.fillStyle = `hsl(${p.hue},74%,${58 + p.life*12}%)`;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.w, p.h, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

// ── Post-bloom warm glow ──────────────────────────────────────────────
function bloomGlow(strength) {
  if (strength <= 0) return;
  const g = ctx.createRadialGradient(BX, BY, 0, BX, BY, BR*1.4);
  g.addColorStop(0,   `rgba(200,60,30,${.09*strength})`);
  g.addColorStop(.55, `rgba(180,30,20,${.04*strength})`);
  g.addColorStop(1,   'rgba(150,10,10,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// ── Vignette ─────────────────────────────────────────────────────────
function vignette() {
  const g = ctx.createRadialGradient(W*.5, H*.42, H*.10, W*.5, H*.52, H*.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.15)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// ── Main render loop ─────────────────────────────────────────────────
let revealed = false;

function frame(now) {
  const t = Math.min((now - t0) / TOTAL, 1);

  // Background
  ctx.fillStyle = '#f2eeea';
  ctx.fillRect(0, 0, W, H);

  // Wait for image
  if (!img.complete || !img.naturalWidth) {
    requestAnimationFrame(frame);
    return;
  }

  if (t >= 1) {
    // After animation: full photo with effects
    ctx.drawImage(img, 0, 0, W, H);
  } else {
    // ── 1. Stem tube grows upward ──────────────────────────────────
    const stemP = ph(t, .00, .38, easeOut3);
    if (stemP > 0) clipDraw(() => stemTube(stemP));

    // ── 2. Leaves unfurl (easeOutBack = springy) ──────────────────
    LEAVES.forEach(l => {
      const p = ph(t, l.t0, l.t1, easeOutBack);
      if (p > 0) clipDraw(() =>
        ctx.ellipse(l.cx, l.cy, l.rx * p, l.ry * p, l.rot, 0, Math.PI*2)
      );
    });

    // ── 3. Bloom: per-petal circles open in sequence ───────────────
    PETALS.forEach(b => {
      const p = ph(t, b.t0, b.t1, easeInOut4);
      if (p > 0) clipDraw(() => ctx.arc(b.cx, b.cy, b.r * p, 0, Math.PI*2));
    });
  }

  // Post-bloom warm glow
  const glowP = ph(t, .88, 1.0, easeOutSine);
  bloomGlow(glowP);

  // Vignette
  vignette();

  // Floating petal particles
  if (t > .87 && Math.random() < .20) spawnPetal();
  if (ptcls.length > 0) drawParticles();

  // Reveal message
  if (t >= 1 && !revealed) {
    revealed = true;
    document.getElementById('msg').classList.add('show');
  }

  requestAnimationFrame(frame);
}

img.onload  = () => requestAnimationFrame(frame);
img.onerror = () => console.error('rose.jpeg not found');
</script>
</body>
</html>
